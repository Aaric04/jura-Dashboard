    function getDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getISOWeekInfo(dateObj) {
      const d = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      const isoYear = d.getUTCFullYear();

      const localCopy = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      const localDay = localCopy.getDay() || 7;
      const monday = new Date(localCopy);
      monday.setDate(localCopy.getDate() - localDay + 1);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const fmtShort = (dt) => dt.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
      const fmtFull = (dt) => dt.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });

      return {
        weekNo, isoYear, weekKey: `${isoYear}-W${String(weekNo).padStart(2, '0')}`,
        rangeLabel: `${fmtShort(monday)}. – ${fmtFull(sunday)}`,
        todayLabel: dateObj.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' })
      };
    }

    function CircularProgress({ percentage, size = 128, strokeWidth = 11, color = '#6366f1', sublabel, isDark }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (Math.min(100, Math.max(0, percentage)) / 100) * circumference;
      return h('div', { className: 'relative inline-flex items-center justify-center', style: { width: size, height: size } },
        h('svg', { width: size, height: size, className: 'transform -rotate-90' },
          h('circle', { cx: size / 2, cy: size / 2, r: radius, fill: 'transparent', stroke: isDark ? 'rgba(255,255,255,0.08)' : 'rgba(15,23,42,0.08)', strokeWidth }),
          h('circle', { cx: size / 2, cy: size / 2, r: radius, fill: 'transparent', stroke: color, strokeWidth, strokeDasharray: circumference, strokeDashoffset: offset, strokeLinecap: 'round', className: 'transition-all duration-700 ease-out' })
        ),
        h('div', { className: 'absolute inset-0 flex flex-col items-center justify-center text-center' },
          h('span', { className: 'text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight' }, `${Math.round(percentage)}%`),
          sublabel ? h('span', { className: 'text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400' }, sublabel) : null
        )
      );
    }

    function App() {
      const now = useMemo(() => new Date(), []);
      const currentDateKey = useMemo(() => getDateKey(now), [now]);
      const currentWeekInfo = useMemo(() => getISOWeekInfo(now), [now]);

      // --- ZEITLEISTE LOGIK ---
      const semesterTimeline = useMemo(() => {
        const start = new Date('2026-10-01T00:00:00').getTime();
        const endLern = new Date('2027-01-31T23:59:59').getTime();
        const endPruef = new Date('2027-03-31T23:59:59').getTime();
        const curr = now.getTime();

        const totalLern = endLern - start;
        const totalPruef = endPruef - endLern;
        const total = endPruef - start;

        const passedLern = Math.max(0, Math.min(curr - start, totalLern));
        const passedPruef = Math.max(0, Math.min(curr - endLern, totalPruef));

        return {
          lernPctWidth: (totalLern / total) * 100,
          pruefPctWidth: (totalPruef / total) * 100,
          lernFillPct: (passedLern / totalLern) * 100,
          pruefFillPct: (passedPruef / totalPruef) * 100,
          daysLeftLern: Math.max(0, Math.ceil((endLern - curr) / (1000 * 60 * 60 * 24))),
          daysLeftPruef: Math.max(0, Math.ceil((endPruef - Math.max(curr, endLern)) / (1000 * 60 * 60 * 24))),
          isPruefung: curr > endLern
        };
        
      }, [now]);
      const [isDark, setIsDark] = useState(() => {
        const savedTheme = localStorage.getItem('ws2627_theme');
        return savedTheme ? savedTheme === 'dark' : true;
      });

      useEffect(() => {
        const rootEl = document.documentElement;
        if (isDark) { rootEl.classList.add('dark'); localStorage.setItem('ws2627_theme', 'dark'); }
        else { rootEl.classList.remove('dark'); localStorage.setItem('ws2627_theme', 'light'); }
      }, [isDark]);

      // Lokale Basisdaten laden
      const [modules, setModules] = useState(() => {
        try {
          const saved = localStorage.getItem('ws2627_app_v4_modules');
          if (saved) {
            const parsed = JSON.parse(saved);
            return parsed.map(m => ({ ...m, flashcardsDone: m.flashcardsDone || false }));
          }
          return INITIAL_MODULES;
        } catch { return INITIAL_MODULES; }
      });

      const [todos, setTodos] = useState(() => {
        try {
          const saved = localStorage.getItem('ws2627_app_v4_todos');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [metaState, setMetaState] = useState(() => {
        try {
          const saved = localStorage.getItem('ws2627_app_v4_meta');
          return saved ? JSON.parse(saved) : { lastDateKey: currentDateKey, lastWeekKey: currentWeekInfo.weekKey };
        } catch { return { lastDateKey: currentDateKey, lastWeekKey: currentWeekInfo.weekKey }; }
      });

      const [syncStatus, setSyncStatus] = useState('Verbinde...');
      const isRemoteUpdate = useRef(false);

      // --- FIRESTORE REALTIME SYNC ENGINE ---
      useEffect(() => {
        if (!db) {
          setSyncStatus('Lokal (Offline)');
          return;
        }

        const docRef = db.collection('dashboard_state').doc('studium_aaric');

        // Snapshot-Listener für automatische Live-Updates auf allen Geräten
        const unsubscribe = docRef.onSnapshot((doc) => {
          if (doc.exists) {
            const data = doc.data();
            isRemoteUpdate.current = true;
            if (data.modules) setModules(data.modules);
            if (data.todos) setTodos(data.todos);
            if (data.metaState) setMetaState(data.metaState);
            setSyncStatus('Cloud synchronisiert');
            setTimeout(() => { isRemoteUpdate.current = false; }, 200);
          } else {
            // Noch kein Cloud-Dokument: Lokalen Stand initial hochladen
            docRef.set({ modules, todos, metaState, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
              .then(() => setSyncStatus('Cloud synchronisiert'))
              .catch(err => setSyncStatus('Fehler: ' + err.message));
          }
        }, (err) => {
          console.error("Firestore Sync Fehler:", err);
          setSyncStatus('Sync-Fehler');
        });

        return () => unsubscribe();
      }, []);

      // Änderungen in Firestore speichern & lokal cachen
      const pushStateToCloud = (newModules, newTodos, newMeta) => {
        try { localStorage.setItem('ws2627_app_v4_modules', JSON.stringify(newModules)); } catch {}
        try { localStorage.setItem('ws2627_app_v4_todos', JSON.stringify(newTodos)); } catch {}
        try { localStorage.setItem('ws2627_app_v4_meta', JSON.stringify(newMeta)); } catch {}

        if (db && !isRemoteUpdate.current) {
          db.collection('dashboard_state').doc('studium_aaric').set({
            modules: newModules,
            todos: newTodos,
            metaState: newMeta,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }).catch(err => console.error("Firestore Schreibfehler:", err));
        }
      };

      // Automatischer Tages- und Wochenwechsel
      useEffect(() => {
        if (metaState.lastDateKey !== currentDateKey || metaState.lastWeekKey !== currentWeekInfo.weekKey) {
          const isNewWeek = metaState.lastWeekKey !== currentWeekInfo.weekKey;
          const isNewDay = metaState.lastDateKey !== currentDateKey;

          let updatedModules = modules;
          if (isNewDay) {
            updatedModules = modules.map(m => ({ ...m, flashcardsDone: false }));
            setModules(updatedModules);
          }

          const updatedTodos = todos.map((t) => {
            let updated = { ...t };
            if (isNewDay && updated.isToday) {
              if (updated.completed) { updated.isToday = false; } else { updated.rolledOverFrom = 'Vortag'; }
            }
            if (isNewWeek && updated.isWeek) {
              if (updated.completed) { updated.isWeek = false; updated.isToday = false; } else { updated.rolledOverFrom = `Vorwoche (${metaState.lastWeekKey.split('-')[1]})`; }
            }
            return updated;
          });

          const updatedMeta = { lastDateKey: currentDateKey, lastWeekKey: currentWeekInfo.weekKey };
          setTodos(updatedTodos);
          setMetaState(updatedMeta);
          pushStateToCloud(updatedModules, updatedTodos, updatedMeta);
        }

                        h('label', { className: 'inline-flex items-center gap-1 cursor-pointer' }, h('input', { type: 'radio', name: `scope_${mod.id}`, checked: moduleInputs[mod.id]?.scope === 'week', onChange: () => setModuleInputs(p => ({ ...p, [mod.id]: { ...p[mod.id], scope: 'week' } })), className: 'accent-emerald-500' }), 'Woche'),
                        h('label', { className: 'inline-flex items-center gap-1 cursor-pointer' }, h('input', { type: 'radio', name: `scope_${mod.id}`, checked: moduleInputs[mod.id]?.scope === 'today', onChange: () => setModuleInputs(p => ({ ...p, [mod.id]: { ...p[mod.id], scope: 'today' } })), className: 'accent-sky-500' }), 'Heute')
                      )
                    )
                  )
                );
              })
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(App));
  </script>
